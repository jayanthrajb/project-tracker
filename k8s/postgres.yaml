# Optional demo database for local clusters only.
# Skip this manifest when you already have an existing or managed PostgreSQL instance,
# and point DATABASE_URL at that database instead.
# Replace the placeholder password in this Secret before applying the StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: project-tracker-postgres
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: database
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: project-tracker-postgres
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: project-tracker-postgres
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: database
spec:
  serviceName: project-tracker-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-tracker
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-tracker
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: project_tracker
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-tracker-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: project-tracker
          app.kubernetes.io/component: database
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
