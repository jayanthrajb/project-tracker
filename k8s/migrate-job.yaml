# Run this job before or alongside API rollouts so database migrations are applied first.
apiVersion: batch/v1
kind: Job
metadata:
  name: project-tracker-migrate
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-tracker
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: project-tracker-api:latest
          imagePullPolicy: IfNotPresent
          command: ['npx', 'prisma', 'migrate', 'deploy']
          workingDir: /app/apps/api
          envFrom:
            - secretRef:
                name: project-tracker-secrets
            - configMapRef:
                name: project-tracker-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
