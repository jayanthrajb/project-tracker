apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-tracker-web
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-tracker
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-tracker
        app.kubernetes.io/component: web
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: project-tracker-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: project-tracker-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: project-tracker-web
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
