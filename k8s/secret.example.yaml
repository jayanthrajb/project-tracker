# Example only: do not commit real credentials. Create the live secret with:
# kubectl create secret generic project-tracker-secrets \
#   --namespace project-tracker \
#   --from-literal=DATABASE_URL='postgresql://db-user:db-password@db.example.com:5432/project_tracker?schema=public' \
#   --from-literal=JWT_SECRET='replace-with-a-long-random-secret' \
#   --from-literal=S3_ACCESS_KEY_ID='replace-with-minio-access-key' \
#   --from-literal=S3_SECRET_ACCESS_KEY='replace-with-minio-secret-key'
# Use credentials for your centralized MinIO endpoint; never commit production values.
apiVersion: v1
kind: Secret
metadata:
  name: project-tracker-secrets
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: shared-config
stringData:
  DATABASE_URL: "postgresql://db-user:db-password@db.example.com:5432/project_tracker?schema=public"
  JWT_SECRET: replace-with-a-long-random-secret
  S3_ACCESS_KEY_ID: replace-with-minio-access-key
  S3_SECRET_ACCESS_KEY: replace-with-minio-secret-key
