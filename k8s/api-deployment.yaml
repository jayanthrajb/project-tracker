apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-tracker-api
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: project-tracker
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: project-tracker
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: project-tracker-uploads
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              attempts=0
              until pg_isready -d "$DATABASE_URL"; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo 'database did not become reachable in time'
                  exit 1
                fi
                echo "waiting for database ($attempts/60)"
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-tracker-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: api
          image: project-tracker-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - secretRef:
                name: project-tracker-secrets
            - configMapRef:
                name: project-tracker-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/apps/api/uploads
---
apiVersion: v1
kind: Service
metadata:
  name: project-tracker-api
  namespace: project-tracker
  labels:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: project-tracker
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
